name: TubeKeep
options:
  bundleIdPrefix: com.hreinsson
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8FB39RNRQQ
    SWIFT_VERSION: "5.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
targets:
  TubeKeep:
    type: application
    platform: macOS
    sources:
      - TubeKeep
      - path: Vendor/mediaremote-adapter.pl
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
      - framework: Vendor/MediaRemoteAdapter.framework
        embed: true
        link: false
        codeSign: true
    entitlements:
      path: TubeKeep/TubeKeep.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    info:
      path: TubeKeep/Info.plist
      properties:
        CFBundleDisplayName: TubeKeep
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: © 2026 Hlynur Hreinsson
        NSAppleEventsUsageDescription: TubeKeep reads your browser's tabs to find the YouTube video you're watching.
        CFBundleURLTypes:
          - CFBundleURLName: com.hreinsson.TubeKeep
            CFBundleURLSchemes: [tubekeep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hreinsson.TubeKeep
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
