name: TubeKeep
options:
  bundleIdPrefix: com.hreinsson
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8FB39RNRQQ
    SWIFT_VERSION: "5.0"
targets:
  TubeKeep:
    type: application
    platform: macOS
    sources:
      - TubeKeep
    info:
      path: TubeKeep/Info.plist
      properties:
        CFBundleDisplayName: TubeKeep
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: © 2026 Hlynur Hreinsson
        CFBundleURLTypes:
          - CFBundleURLName: com.hreinsson.TubeKeep
            CFBundleURLSchemes: [tubekeep]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hreinsson.TubeKeep
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
